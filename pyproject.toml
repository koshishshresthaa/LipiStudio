[project]
name = "lipistudio"
version = "0.1.0"
description = "High-impact AI video captioning engine for short-form content."
readme = "README.md"
authors = [
    { name = "koshishshresthaa", email = "koshishshrestha74@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "ffmpeg-python>=0.2.0",
    "numba>=0.59.0",
    "numpy<2.0.0",
    "openai-whisper>=20231117",
    "python-multipart>=0.0.9",
    "torch>=2.3.0",
    "uvicorn>=0.30.0",
    "ruff>=0.14.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=4.5.1",
]

[project.scripts]
lipistudio-api = "lipistudio.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lipistudio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
